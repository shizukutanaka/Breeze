name = "breeze"
pages_build_output_dir = "."
compatibility_date = "2024-12-01"

# KV Binding (create via Dashboard or CLI)
# wrangler kv:namespace create KV
# Then paste the ID below (or bind via Dashboard: Pages > Settings > Functions > KV)
[[kv_namespaces]]
binding = "KV"
id = ""  # ← REQUIRED: paste your KV namespace ID here

# === SECRETS (set via CLI — never commit values) ===
#
# --- Web Push ---
# npx web-push generate-vapid-keys
# wrangler pages secret put VAPID_PUBLIC_KEY
# wrangler pages secret put VAPID_PRIVATE_KEY
#
# --- TURN Relay ---
# Option A (recommended): Cloudflare Calls TURN ($0.05/GB, global anycast)
# wrangler pages secret put TURN_KEY_ID               # From Dashboard > Calls > TURN App
# wrangler pages secret put TURN_KEY_API_TOKEN         # From Dashboard > Calls > TURN App
# Option B: Custom HMAC (Coturn self-hosted)
# wrangler pages secret put TURN_URL                  # turn:host:3478
# wrangler pages secret put TURN_SECRET               # HMAC shared secret
# Option C: Static credentials (metered.ca, twilio, etc.)
# wrangler pages secret put TURN_URL                  # turn:relay.example:80
# wrangler pages secret put TURN_USERNAME              # static username
# wrangler pages secret put TURN_CREDENTIAL            # static credential
# Option D: No config → auto-falls to free Open Relay (20GB/month)
#
# --- STUN (optional) ---
# wrangler pages secret put STUN_URL                   # stun:host:3478 — self-hosted overrides the public list;
#                                                       # unset + plain turn: TURN_URL auto-derives stun: on the same host
#
# --- Moderation (optional) ---
# wrangler pages secret put ABUSE_WEBHOOK_URL          # Notified on verified abuse reports
#                                                       # (metadata only — frankId, message
#                                                       # length, timestamp; never message content)
#
# --- Anti-spam tuning (optional — default 20, matches the client's PoW difficulty) ---
# wrangler pages secret put MIN_POW_DIFFICULTY         # Server-side PoW acceptance floor for
#                                                       # @alias registration
#
# --- Auth hardening ---
# Every registered client already signs the actions below with its Ed25519 identity key;
# these flags tell the Worker to REJECT a request that omits/fails that signature
# instead of silently accepting it.
#
# MSG_REQUIRE_AUTH and SEALED_REQUIRE_AUTH are DEFAULT-ON: unsigned /msg/poll is
# destructive (a future lastTs purges an undelivered inbox) and unsigned sealed/ack
# blind-deletes a sealed queue, so both reject unsigned callers unless you explicitly
# opt out by setting the secret to "false" (only needed while serving pre-signing
# clients — check CHANGELOG.md for when each call started signing).
# wrangler pages secret put MSG_REQUIRE_AUTH           # "false" — re-allow unsigned /msg/poll
# wrangler pages secret put SEALED_REQUIRE_AUTH        # "false" — re-allow unsigned sealed/poll + sealed/ack
# wrangler pages secret put PREKEY_REQUIRE_AUTH        # "false" — re-allow unsigned prekey bundle overwrite
#
# PREKEY_REQUIRE_AUTH is also DEFAULT-ON, but differently: once a bundle carries an
# Ed25519 key, overwriting it requires a signature by the INCUMBENT key (unsigned could
# otherwise clobber any registered userId with a poisoned bundle). First writes and
# legacy bundles without an Ed key stay open (nothing to verify against).
#
# The remaining flags stay opt-in for zero-config self-hosting; set to "true" to enforce.
# wrangler pages secret put PRESENCE_REQUIRE_AUTH      # true — require Ed25519 ownership sig on presence writes
# wrangler pages secret put ALIAS_REQUIRE_AUTH         # true — reject unsigned @alias registration
# wrangler pages secret put GROUP_REQUIRE_AUTH         # true — reject unsigned group kick/rename/admin/leave/delete/transfer
# wrangler pages secret put PUSH_REQUIRE_AUTH          # true — reject unsigned push subscribe/unsubscribe
# wrangler pages secret put TURN_REQUIRE_AUTH          # false — opt OUT; configured TURN providers default to registered-only
# wrangler pages secret put BACKUP_REQUIRE_AUTH        # true — without this, knowing a userId is enough to download that user's encrypted backup blob
