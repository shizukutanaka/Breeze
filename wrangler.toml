name = "breeze"
pages_build_output_dir = "."
compatibility_date = "2024-12-01"

# KV Binding (create via Dashboard or CLI)
# wrangler kv:namespace create KV
# Then paste the ID below (or bind via Dashboard: Pages > Settings > Functions > KV)
[[kv_namespaces]]
binding = "KV"
id = ""  # ← REQUIRED: paste your KV namespace ID here

# Durable Object mailbox backend (stage-1 step 2, 2026-11-13). MailboxDO
# lives in _worker.js: one instance per recipient holds both queue families
# (inbox + sealed) in DO storage once MAILBOX_BACKEND=do (see below and
# docs/MAILBOX_STAGE1_PLAN.md). KV stays the default backend.
[[durable_objects.bindings]]
name = "MAILBOX_DO"
class_name = "MailboxDO"

[[migrations]]
tag = "v1-mailbox-do"
new_sqlite_classes = ["MailboxDO"]

# === SECRETS (set via CLI — never commit values) ===
#
# --- Web Push ---
# npx web-push generate-vapid-keys
# wrangler pages secret put VAPID_PUBLIC_KEY
# wrangler pages secret put VAPID_PRIVATE_KEY
#
# --- TURN Relay ---
# Option A (recommended): Cloudflare Calls TURN ($0.05/GB, global anycast)
# wrangler pages secret put TURN_KEY_ID               # From Dashboard > Calls > TURN App
# wrangler pages secret put TURN_KEY_API_TOKEN         # From Dashboard > Calls > TURN App
# Option B: Custom HMAC (Coturn self-hosted)
# wrangler pages secret put TURN_URL                  # turn:host:3478
# wrangler pages secret put TURN_SECRET               # HMAC shared secret
# Option C: Static credentials (metered.ca, twilio, etc.)
# wrangler pages secret put TURN_URL                  # turn:relay.example:80
# wrangler pages secret put TURN_USERNAME              # static username
# wrangler pages secret put TURN_CREDENTIAL            # static credential
# Option D: No config → auto-falls to free Open Relay (20GB/month)
#
# --- Moderation (optional) ---
# wrangler pages secret put ABUSE_WEBHOOK_URL          # Notified on verified abuse reports
#                                                       # (metadata only — frankId, message
#                                                       # length, timestamp; never message content)
#
# --- Anti-spam tuning (optional — default 20, matches the client's PoW difficulty) ---
# wrangler pages secret put MIN_POW_DIFFICULTY         # Server-side PoW acceptance floor for
#                                                       # @alias registration
#
# --- Auth hardening ---
# Two gates need NO signature — they only require the account to be REGISTERED
# (prekey bundle present) — and are ON BY DEFAULT (stage-0 hardening, 2026-11-13):
# every client registers at identity creation and re-uploads automatically when
# the bundle record expires. Set one to "false" only if your deployment must
# serve clients that never register.
# wrangler pages secret put PRESENCE_REQUIRE_AUTH      # false — opt out: allow presence writes from unregistered ids (default: registered only)
# wrangler pages secret put TURN_REQUIRE_AUTH          # false — opt out: issue TURN credentials to unregistered ids (default: registered only)
#
# The remaining flags reject requests that omit/fail an Ed25519 ownership
# signature. Every current client already signs these actions; the flags stay
# OPT-IN because clients on runtimes without WebCrypto Ed25519 cannot sign at
# all, and pre-rollout clients never signed — a mandatory default would cut
# those clients off (for QUEUE: total receive loss). Enable once you're not
# also serving such clients (check CHANGELOG.md for when each call started
# signing).
# wrangler pages secret put ALIAS_REQUIRE_AUTH         # true — reject unsigned @alias registration
# wrangler pages secret put GROUP_REQUIRE_AUTH         # true — reject unsigned group create/kick/rename/admin/leave/delete/transfer
# wrangler pages secret put PUSH_REQUIRE_AUTH          # true — reject unsigned push subscribe/unsubscribe
# wrangler pages secret put QUEUE_REQUIRE_AUTH         # true — reject unsigned msg/sealed poll + sealed ack (queue read/delete)
# wrangler pages secret put PREKEY_REQUIRE_AUTH        # true — reject unsigned prekey uploads (bundle overwrite = identity takeover)
# wrangler pages secret put BACKUP_REQUIRE_AUTH        # true — without this, knowing a userId is enough to download that user's encrypted backup blob
#
# --- Plain relay path (deprecated) ---
# /api/msg/send + /api/msg/poll responses carry a `Deprecation: true` header.
# Operators who have confirmed no live client still needs the fallback can
# disable the path outright (requests get 410 PLAIN_PATH_DISABLED):
# wrangler pages secret put PLAIN_PATH_DISABLED        # true — disable the legacy plain relay path
#
# --- Relay identity (stage-2 step 4) ---
# A persistent Ed25519 keypair lets clients pin THIS relay and detect
# substitution (see SECURITY.md, "Relay identity"). Both halves must
# be set: /api/health advertises the public half as `relayKey` and
# POST /api/relay/attest proves possession. Unset = no key advertised
# and clients keep the pre-step-4 implicit trust. Generate a pair:
#   node -e "const c=require('node:crypto');const k=c.generateKeyPairSync('ed25519');console.log('RELAY_PUBLIC_KEY='+Buffer.from(k.publicKey.export({format:'jwk'}).x,'base64url').toString('base64'));console.log('RELAY_PRIVATE_KEY='+k.privateKey.export({format:'der',type:'pkcs8'}).toString('base64'))"
# wrangler pages secret put RELAY_PUBLIC_KEY          # raw Ed25519 public key, base64
# wrangler pages secret put RELAY_PRIVATE_KEY         # PKCS#8 DER private key, base64 (secret!)
# Treat the private half like a password: anyone holding it can
# impersonate your relay to every client that pinned it.
#
# --- Registration admission (stage-2 step 3) ---
# Setting REGISTRATION_ALLOWLIST (comma-separated Breeze IDs) closes
# ACCOUNT CREATION to those IDs: only a prekey upload for an ID with no
# stored bundle is gated, so existing accounts are unaffected. Unset =
# open registration (the default here); the Docker packaging sets it
# (possibly empty) so self-hosts are closed by default.
# wrangler pages secret put REGISTRATION_ALLOWLIST     # id1,id2 — close registration to these IDs
#
# --- Usage quota / fair use (2026-11-14, docs/COST_MODEL.md §10) ---
# The default relay is a free entrance with a bounded frame: per
# mailbox, deposits are capped per UTC day/month (defaults 10,000 /
# 200,000 — ~50x a heavy user's measured traffic). Past the cap the
# sender gets 429 USAGE_QUOTA_EXCEEDED with the window and limit.
# Enforced only together with MAILBOX_BACKEND=do (it rides the
# per-mailbox deposit gate). A relay run for its owner's own accounts
# should set USAGE_QUOTA_ENABLED=false — the frame is for the shared
# default entrance, not for your own frame (docs/SELF_HOSTING.md).
# wrangler pages secret put USAGE_QUOTA_ENABLED        # false — disable the quota (default: enabled)
# wrangler pages secret put USAGE_QUOTA_DAILY          # 10000 — deposits per mailbox per UTC day
# wrangler pages secret put USAGE_QUOTA_MONTHLY        # 200000 — deposits per mailbox per UTC month
#
# --- Mailbox storage backend (stage-1 step 2) ---
# Mailboxes live in KV by default. Setting MAILBOX_BACKEND=do serves them
# from the per-recipient MailboxDO instead (binding above); each mailbox
# drains from KV into its DO on first access, then the KV copy is deleted.
# Rollback = set it back to kv (mailboxes not yet drained are unaffected;
# drained ones keep serving from KV's remaining state — see the plan doc).
# wrangler pages secret put MAILBOX_BACKEND            # do — serve mailboxes from MailboxDO (default: kv)
#
# --- Presence storage backend (stage-1 step 4) ---
# Same binding, separate flag: the presence record can live in the
# user's own MailboxDO instead of KV (it drains on first access, like
# the mailboxes, but independently — either flag can move without the
# other). With mailboxes moved, presence heartbeats were the largest
# remaining consumer of the free tier's 1,000 KV writes/day.
# wrangler pages secret put PRESENCE_BACKEND           # do — serve presence from MailboxDO (default: kv)
#
# --- WebSocket delivery (stage-1 step 5) ---
# A hibernatable WebSocket per recipient wakes the client when a
# deposit lands, replacing the 3s foreground poll with a push + slow
# safety poll. Wake-up only: message data always moves via the poll
# endpoints, and clients that never connect (or cannot produce the
# required Ed25519 ownership signature) keep polling unchanged.
# Takes effect only together with MAILBOX_BACKEND=do — the wake-up is
# emitted inside the recipient's MailboxDO as it stores a deposit.
# wrangler pages secret put MAILBOX_WS_ENABLED         # true — serve GET /api/mailbox/ws (default: off, route not served)
