# Release — tag-driven distribution ZIP for self-hosting.
#
# Why this exists: the only Release asset was a ~8-month-old ZIP, because
# cutting a release was manual. Now it is one action: push a version tag
# (e.g. `git tag v3.6.1 && git push origin v3.6.1`) and this workflow
# tests, packages and publishes the Release. The ZIP's contents are the
# deployable unit defined by tools/package-release.sh (the runtime tree
# a user drops on their own Cloudflare Pages / Docker / Node host) — the
# creator operates no official instance, so the Release page is the
# distribution point and the user's own placement is the runtime.
#
# Triggers:
#   * push of a `v*` tag  → full pipeline + GitHub Release with the ZIP
#     and SHA256SUMS.txt attached.
#   * workflow_dispatch   → same packaging, but NO Release is created;
#     the ZIP is uploaded as a workflow artifact only, so the packaging
#     can be verified without publishing anything.
#
# Note: .github/workflows/ is listed in .gitignore (see ci.yml's header
# comment); like ci.yml, this file is force-added intentionally.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (e.g. v3.6.1). Empty = derive from index.html CONFIG.VERSION.'
        required: false
        type: string

permissions:
  contents: write # creating the Release on tag pushes; unused on dispatch

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Quality gates
        run: |
          chmod +x validate.sh
          ./validate.sh

      - name: Determine version label
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            LABEL="${{ github.ref_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            LABEL="${{ inputs.version }}"
          else
            LABEL="v$(grep -o "VERSION: '[^']*'" index.html | head -1 | sed "s/VERSION: '//; s/'//")"
          fi
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "Release label: $LABEL"

      # Stage 6 step 4 gate: a release whose label disagrees with
      # ANY in-repo version site is a mislabeled artifact — refuse
      # it here instead of shipping it. --check anchors every site
      # to CONFIG.VERSION; the label must equal it (with the v).
      - name: Version parity gate
        run: |
          node tools/bump-version.mjs --check
          APP="v$(grep -o "VERSION: '[^']*'" index.html | head -1 | sed "s/VERSION: '//; s/'//")"
          if [ "${{ steps.version.outputs.label }}" != "$APP" ]; then
            echo "::error::Release label ${{ steps.version.outputs.label }} != in-repo version $APP — bump with tools/bump-version.mjs first"
            exit 1
          fi

      - name: Build distribution ZIP + checksums
        run: bash tools/package-release.sh "${{ steps.version.outputs.label }}" dist-release

      - name: Verify checksum
        run: |
          cd dist-release
          sha256sum -c SHA256SUMS.txt
          unzip -Z1 "breeze-${{ steps.version.outputs.label }}.zip"

      - name: Upload as workflow artifact (always — this is the dispatch verification path)
        uses: actions/upload-artifact@v4
        with:
          name: breeze-${{ steps.version.outputs.label }}
          path: dist-release/
          if-no-files-found: error

      - name: Create GitHub Release (tag pushes only)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LABEL="${{ steps.version.outputs.label }}"
          cat > release-notes.md <<'EOF'
          Self-hostable release: unzip, then run Breeze on your own placement
          (Cloudflare Pages, Docker, or bare Node) — see `DEPLOY.txt` inside
          the ZIP and `docs/SELF_HOSTING.md` for the full guide.
          Desktop apps for Windows, macOS and Linux are attached below
          (built natively per OS by the `desktop` job); the same code
          also builds for Android/iOS from `mobile/`.
          What changed: see `CHANGELOG.md` in the repository for this
          version's section. Known limitations are stated in
          `docs/COMPARISON.md` ("Where Breeze loses").

          Verify the download:

          ```
          sha256sum -c SHA256SUMS.txt
          ```
          EOF
          gh release create "$LABEL" \
            "dist-release/breeze-$LABEL.zip" \
            "dist-release/SHA256SUMS.txt" \
            --title "Breeze $LABEL" \
            --notes-file release-notes.md

  # All-OS desktop builds (owner instruction 2026-11-20: target
  # every OS). Each installer is built NATIVELY on its own runner —
  # no wine cross-builds, no mac signing workarounds — from the
  # same tree the package job just tested. On tag pushes the
  # artifacts attach to the Release the package job created; on
  # dispatch they land as workflow artifacts only.
  desktop:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: win
            files: "desktop/dist/*.exe"
          - os: macos-latest
            script: mac
            # upload-artifact splits paths on newlines, not spaces —
            # a space-separated list is one pattern that matches
            # nothing (the v3.7.0 mac leg's build succeeded and its
            # upload then failed with "No files were found").
            files: |
              desktop/dist/*.dmg
              desktop/dist/*.zip
          - os: ubuntu-latest
            script: linux
            files: |
              desktop/dist/*.AppImage
              desktop/dist/*.deb
              desktop/dist/*.rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Linux leg also builds DEB and RPM targets (both are
      # attached to the Release); electron-builder shells out to
      # rpmbuild for the RPM via fpm 1.9.3. fpm's generated spec
      # assumes the pre-6.0 buildroot contract (`--define buildroot`
      # plus `BuildRoot: %buildroot`, with %install a noop over a
      # tree fpm pre-populates); rpmbuild 6 ignores the BuildRoot
      # tag and checks the files under its own per-package
      # buildroot, so every file is reported "not found" —
      # reproduced locally against rpmbuild 6.1 with fpm's swallowed
      # stderr captured (PRE-RELEASE-AUDIT Addendum 5). The runner's
      # apt now serves rpm 6.x, so pin the pre-rework line instead:
      # the Debian bookworm rpm 4.18 .deb set, extracted (not
      # installed) into a prefix and placed first on PATH. The same
      # set was verified locally to build this package's RPM end to
      # end.
      - name: Provision RPM tooling (Linux leg only)
        if: matrix.script == 'linux'
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/rpm418"
          mkdir -p "$prefix/debs"
          base="https://deb.debian.org/debian/pool/main"
          cd "$prefix/debs"
          curl -fsSLO "$base/r/rpm/rpm_4.18.0+dfsg-1+deb12u1_amd64.deb"
          curl -fsSLO "$base/r/rpm/rpm-common_4.18.0+dfsg-1+deb12u1_amd64.deb"
          curl -fsSLO "$base/r/rpm/librpm9_4.18.0+dfsg-1+deb12u1_amd64.deb"
          curl -fsSLO "$base/r/rpm/librpmbuild9_4.18.0+dfsg-1+deb12u1_amd64.deb"
          curl -fsSLO "$base/r/rpm/librpmio9_4.18.0+dfsg-1+deb12u1_amd64.deb"
          curl -fsSLO "$base/r/rpm/librpmsign9_4.18.0+dfsg-1+deb12u1_amd64.deb"
          curl -fsSLO "$base/p/popt/libpopt0_1.19+dfsg-3_amd64.deb"
          curl -fsSLO "$base/l/lua5.3/liblua5.3-0_5.3.6-2_amd64.deb"
          curl -fsSLO "$base/e/elfutils/libelf1_0.188-2.1_amd64.deb"
          curl -fsSLO "$base/e/elfutils/libdw1_0.188-2.1_amd64.deb"
          curl -fsSLO "$base/d/debugedit/debugedit_5.0-5_amd64.deb"
          for f in *.deb; do dpkg -x "$f" "$prefix/root"; done
          echo "$prefix/root/usr/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$prefix/root/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
          echo "RPM_CONFIGDIR=$prefix/root/usr/lib/rpm" >> "$GITHUB_ENV"
          export LD_LIBRARY_PATH="$prefix/root/usr/lib/x86_64-linux-gnu"
          export RPM_CONFIGDIR="$prefix/root/usr/lib/rpm"
          "$prefix/root/usr/bin/rpmbuild" --version

      - name: Build desktop app (${{ matrix.script }})
        shell: bash
        run: bash build.sh ${{ matrix.script }}

      - name: Upload as workflow artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: breeze-desktop-${{ matrix.script }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Attach to GitHub Release (tag pushes only)
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # matrix.files is newline-separated (upload-artifact splits
          # on newlines), and a newline terminates a `for ... in`
          # list — the v3.7.0 third run's mac leg died here with a
          # syntax error on the second pattern. Read the patterns
          # line by line and glob each one instead.
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            for f in $pattern; do
              gh release upload "${{ github.ref_name }}" "$f" --clobber
            done
          done <<< "${{ matrix.files }}"

  # Android verification build. The APK is uploaded as a workflow
  # artifact only — attaching an installable Android package to
  # the public Release waits for release signing (keystore
  # secrets are the owner's to provide; a debug-signed APK is
  # not a distribution artifact).
  android:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        shell: bash
        run: |
          cd mobile
          npm ci
          bash scripts/build-mobile.sh android debug

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: breeze-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
